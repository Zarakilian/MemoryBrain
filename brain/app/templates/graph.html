{% extends "base.html" %}
{% block title %}Graph — MemoryBrain{% endblock %}
{% block content %}

<div class="page-head">
  <h1>Graph {% if project %}<span class="hint">— {{ project }}</span>{% endif %}</h1>
  <div class="graph-controls">
    <select id="g-project">
      <option value="">all projects</option>
      {% for p in projects %}
      <option value="{{ p.slug }}" {{ 'selected' if project == p.slug }}>{{ p.name or p.slug }}</option>
      {% endfor %}
    </select>
    <label class="slider-label">min weight
      <input id="g-weight" type="range" min="0.1" max="0.9" step="0.05" value="0.35">
      <span id="g-weight-val">0.35</span>
    </label>
  </div>
</div>

<div class="graph-wrap panel">
  <canvas id="graph"></canvas>
  <div id="g-tooltip" class="g-tooltip" hidden></div>
  <div id="g-empty" class="empty g-empty" hidden>No links to draw — lower the weight slider, or run the graph rebuild.</div>
  <div id="g-legend" class="g-legend"></div>
</div>

{% endblock %}
{% block scripts %}<script src="/static/js/graph.js"></script>{% endblock %}
